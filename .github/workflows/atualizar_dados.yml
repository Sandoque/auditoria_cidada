name: Atualização dos dados e do painel

# Baixa os dados oficiais, reconstrói o pipeline do zero com as regras de qualidade e publica
# os relatórios no GitHub Pages (que serve a main). Regras em specs/multianual.md, seção 7.
# Só sob demanda: o projeto é uma demonstração. Para atualizar toda semana, acrescente em `on:`
#   schedule:
#     - cron: "0 12 * * 1"  # segunda-feira, 12h UTC (9h em Brasília)
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5

      - name: Sincronizar dependências
        run: uv sync

      - name: Baixar dados oficiais (Câmara, CGU e IBGE)
        run: uv run python scripts/baixar_dados_oficiais.py

      - name: Testes unitários
        run: uv run pytest

      - name: Pipeline do zero, qualidade de dados e relatórios
        run: uv run python executar.py

      # Só os relatórios entram no commit: raw/ muda a cada download e faria o repositório crescer sem parar.
      - name: Publicar relatórios na main (só se mudaram)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relatorio*.html
          if git diff --cached --quiet; then
            echo "Relatórios sem mudança; nada a publicar."
          else
            git commit -m "chore(dados): atualiza relatórios com os dados de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git push origin HEAD:main
          fi
